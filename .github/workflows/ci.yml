name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install core + infra + learned deps
        run: |
          python -m pip install --upgrade pip
          # Pinned to the environment the released results were produced with.
          pip install numpy==1.26.4 pandas==2.3.3 matplotlib==3.9.4 scipy==1.13.1 networkx==3.2.1
          pip install pandapower==3.1.2 pandapipes==0.12.0
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip list
      - name: Core engine tests (M8)
        run: |
          python tests/test_core.py
          python tests/test_metrics.py
      - name: Coordinator / infrastructure tests (M9)
        run: python tests/test_m9.py
