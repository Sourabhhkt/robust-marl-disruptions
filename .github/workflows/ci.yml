name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install core + infra + learned deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" pandas matplotlib scipy networkx
          pip install pandapower pandapipes
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Core engine tests (M8)
        run: |
          python tests/test_core.py
          python tests/test_metrics.py
      - name: Coordinator / infrastructure tests (M9)
        run: python tests/test_m9.py
